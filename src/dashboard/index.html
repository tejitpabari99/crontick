<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crontick</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
  <header>
    <h1>⏱ crontick</h1>
    <div id="version-info"></div>
    <div id="health-badge" class="badge badge-unknown">loading…</div>
  </header>
  <main>
    <div class="toolbar">
      <button id="btn-refresh" class="btn">↻ Refresh</button>
      <label>Runs: <input id="runs-limit" type="number" min="1" value="100"></label>
      <label>Job filter: <input id="job-filter" type="text" placeholder="job ID…"></label>
    </div>

    <section class="summary" id="summary"></section>

    <section class="page active">
      <h2>Jobs</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Schedule</th>
            <th>Action</th>
            <th>Enabled</th>
            <th>Last status</th>
            <th>Next run</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
      </table>
    </section>

    <section class="page active">
      <h2>Recent runs</h2>
      <table>
        <thead>
          <tr>
            <th>Run ID</th>
            <th>Job</th>
            <th>Status</th>
            <th>Started</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody id="runs-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
