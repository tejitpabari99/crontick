<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crontick</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('crontick.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage unavailable: follow the OS preference */ }
    })();
  </script>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
  <header>
    <h1>⏱ crontick</h1>
    <div id="version-info"></div>
    <div id="health-badge" class="badge badge-unknown">loading…</div>
    <div class="theme-toggle" role="radiogroup" aria-label="Color theme">
      <div id="theme-toggle" class="segmented">
        <button type="button" role="radio" aria-checked="true" data-theme-choice="system" aria-label="System theme" title="System theme">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6M10 13.5V17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button type="button" role="radio" aria-checked="false" data-theme-choice="light" aria-label="Light theme" title="Light theme">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button type="button" role="radio" aria-checked="false" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M16.5 11.6A7 7 0 0 1 8.4 3.5a7 7 0 1 0 8.1 8.1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <button id="btn-refresh" class="btn">↻ Refresh</button>
      <label>Runs: <input id="runs-limit" type="number" min="1" value="100"></label>
      <div class="auto-refresh" role="radiogroup" aria-label="Auto-refresh interval">
        <span class="auto-refresh-label" aria-hidden="true">Auto-refresh:</span>
        <div id="auto-refresh" class="segmented">
          <button type="button" role="radio" aria-checked="true" data-sec="0">Off</button>
          <button type="button" role="radio" aria-checked="false" data-sec="10">10s</button>
          <button type="button" role="radio" aria-checked="false" data-sec="15">15s</button>
          <button type="button" role="radio" aria-checked="false" data-sec="30">30s</button>
          <button type="button" role="radio" aria-checked="false" data-sec="60">60s</button>
        </div>
      </div>
    </div>

    <div id="inline-error" class="inline-error" hidden></div>

    <section class="summary" id="summary"></section>

    <section class="page active">
      <div class="section-head">
        <h2>Jobs</h2>
        <div class="search" id="jobs-search">
          <input type="search" class="search-input" id="jobs-search-input" placeholder="Search jobs…" aria-label="Search jobs" autocomplete="off" tabindex="-1">
          <button type="button" class="icon-btn search-toggle" aria-label="Search jobs" aria-expanded="false" title="Search jobs">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Alias</th>
            <th>ID</th>
            <th>Description</th>
            <th>Schedule</th>
            <th>Action</th>
            <th>Last status</th>
            <th>Next run</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
      </table>
      </div>
    </section>

    <section class="page active">
      <div class="section-head">
        <h2>Recent runs</h2>
        <div class="runs-toolbar">
          <div class="search" id="runs-search">
            <input type="search" class="search-input" id="runs-search-input" placeholder="Search runs and logs…" aria-label="Search runs and logs" autocomplete="off" tabindex="-1">
            <button type="button" class="icon-btn search-toggle" aria-label="Search runs and logs" aria-expanded="false" title="Search runs and logs">
              <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="multi" id="filter-job">
            <span class="multi-label">Filter Job:</span>
            <button type="button" class="multi-btn" aria-haspopup="true" aria-expanded="false">All jobs</button>
            <div class="multi-menu" role="group" aria-label="Filter by job" hidden></div>
          </div>
          <div class="multi" id="filter-status">
            <span class="multi-label">Filter Status:</span>
            <button type="button" class="multi-btn" aria-haspopup="true" aria-expanded="false">All</button>
            <div class="multi-menu" role="group" aria-label="Filter by status" hidden></div>
          </div>
        </div>
      </div>
      <div id="filter-chips" class="chips" aria-label="Active filters"></div>
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Run ID</th>
            <th>Runner Session ID</th>
            <th aria-sort="none" data-sort="job"><button type="button" class="sort-btn">Job<span class="sort-ind" aria-hidden="true"></span></button></th>
            <th aria-sort="none" data-sort="status"><button type="button" class="sort-btn">Status<span class="sort-ind" aria-hidden="true"></span></button></th>
            <th aria-sort="descending" data-sort="started"><button type="button" class="sort-btn">Started<span class="sort-ind" aria-hidden="true"></span></button></th>
            <th aria-sort="none" data-sort="duration"><button type="button" class="sort-btn">Duration<span class="sort-ind" aria-hidden="true"></span></button></th>
          </tr>
        </thead>
        <tbody id="runs-tbody"></tbody>
      </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="job-drawer" class="drawer-backdrop" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
      <div class="modal-header">
        <h3 id="drawer-title">Job</h3>
        <button id="drawer-close" class="icon-btn" title="Close" aria-label="Close job details">✕</button>
      </div>
      <div class="modal-body" id="drawer-body"></div>
    </aside>
  </div>

  <div id="log-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-header">
        <h3 id="modal-title"><span id="modal-title-text">Run log</span> <span id="modal-status"></span></h3>
        <button id="modal-close" class="icon-btn" title="Close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="modal-meta" class="run-meta"></div>
        <div id="modal-error-section" hidden>
          <h4>Error</h4>
          <pre id="modal-error" class="log-pane error-pane"></pre>
        </div>
        <div id="modal-output-section">
          <h4>Output</h4>
          <pre id="modal-output" class="log-pane"></pre>
        </div>
        <h4>Raw log</h4>
        <div id="modal-rawlog" class="raw-log-row"></div>
      </div>
    </div>
  </div>

  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
