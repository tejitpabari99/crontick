name: Release

# Manual-only: nothing publishes automatically on merge to main. See
# RELEASING.md for the full walkthrough.
#
# mode: version -- runs `changeset version` and opens/updates the
#   "Version Packages" pull request against main. Does not publish.
# mode: publish -- publishes the version already committed on main to npm
#   (run this after merging the Version Packages PR).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'version: open/update the Version Packages PR. publish: publish the version already on main to npm.'
        type: choice
        options:
          - version
          - publish
        default: version
        required: true
      allow_major:
        description: 'Allow a pending major-bump changeset to proceed (blocked by default; see scripts/check-changeset-bumps.mjs)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  verify-package:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile coverage
        run: node scripts/verify-no-lockfile-tampering.mjs

      - name: Build
        run: npm run build

      - name: Typecheck examples against published types
        run: npm run typecheck:examples:dist

      - name: Test
        run: npm test

      - name: Verify tarball contents
        run: node scripts/verify-tarball.mjs

      - name: Install tarball and exercise public exports + all bins
        run: npm run verify-package-install

  release:
    name: Release (${{ inputs.mode }})
    needs: verify-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Guard against unintended major version bumps
        run: npm run check:changesets
        env:
          ALLOW_MAJOR: ${{ inputs.allow_major }}

      - name: Open or update Version Packages PR
        if: ${{ inputs.mode == 'version' }}
        uses: changesets/action@v1
        with:
          version: npx changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: ${{ inputs.mode == 'publish' }}
        run: npm run build

      - name: Publish to npm
        if: ${{ inputs.mode == 'publish' }}
        run: npx changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        if: ${{ inputs.mode == 'publish' }}
        run: git push --follow-tags
